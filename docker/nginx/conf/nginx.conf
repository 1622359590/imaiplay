server {
    listen 80;
    server_name _;
    location /backend/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /health { proxy_pass http://127.0.0.1:8080; }
    location = /health/db { proxy_pass http://127.0.0.1:8080; }
    location /swagger/ { proxy_pass http://127.0.0.1:8080; }
    # The entry document must be revalidated after each deployment. Otherwise a
    # cached old bundle can request a chunk removed by the new image.
    location = /admin/ {
        alias /usr/share/nginx/html/admin/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
    }
    location = /admin/index.html {
        alias /usr/share/nginx/html/admin/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
    }
    location /admin/ { alias /usr/share/nginx/html/admin/; index index.html; try_files $uri $uri/ /admin/index.html; }
    location /pc/ { alias /usr/share/nginx/html/pc/; index index.html; try_files $uri $uri/ /pc/index.html; }
    location /h5/ { alias /usr/share/nginx/html/h5/; index index.html; try_files $uri $uri/ /h5/index.html; }
    location = / { return 302 https://$http_host/pc/; }
    root /usr/share/nginx/html/admin;
    index index.html;
    location / { try_files $uri $uri/ /index.html; }
}
