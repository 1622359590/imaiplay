server {
    listen 80;
    server_name _;
    client_max_body_size 1024m;
    root /usr/share/nginx/html;

    location /backend/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /health { proxy_pass http://127.0.0.1:8080; }
    location = /health/db { proxy_pass http://127.0.0.1:8080; }
    location /swagger/ { proxy_pass http://127.0.0.1:8080; }

    location ~* ^/(admin|pc|h5)/assets/.*\.[a-z0-9]+$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA entry documents must be revalidated after each deployment. Otherwise
    # a cached old bundle can request a chunk removed by the new image.
    location = /admin/index.html {
        alias /usr/share/nginx/html/admin/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
    }
    location = /pc/index.html {
        alias /usr/share/nginx/html/pc/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
    }
    location = /h5/index.html {
        alias /usr/share/nginx/html/h5/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
    }

    location = /login {
        alias /usr/share/nginx/html/pc/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
    }
    location = /select-organization {
        alias /usr/share/nginx/html/pc/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
    }
    location /t/ {
        try_files $uri /pc/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
    }

    location /admin/ {
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }
    location /pc/ {
        index index.html;
        try_files $uri $uri/ /pc/index.html;
    }
    location /h5/ {
        index index.html;
        try_files $uri $uri/ /h5/index.html;
    }

    location = / {
        try_files /pc/index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
    }
    location / { try_files $uri $uri/ /pc/index.html; }
}
