services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-imaiplay}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-imaiplay-dev-password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
  server:
    build: .
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      APP_NAME: ${APP_NAME:-imaiplay}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-imaiplay-dev-password}
      DB_NAME: ${DB_NAME:-imaiplay}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      JWT_SECRET: ${JWT_SECRET:-imaiplay-compose-change-me}
      ADMIN_HOST: ${ADMIN_HOST:-play.imai.work}
      BAOTA_PANEL_URL: ${BAOTA_PANEL_URL:-}
      BAOTA_API_KEY: ${BAOTA_API_KEY:-}
      BAOTA_SERVER_IP: ${BAOTA_SERVER_IP:-}
      BAOTA_PROXY_TARGET: ${BAOTA_PROXY_TARGET:-http://127.0.0.1:18080}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_ROOT: /var/lib/imaiplay/uploads
      STORAGE_LOCAL_URL: ${STORAGE_LOCAL_URL:-http://localhost:8080/uploads}
    ports:
      - "80:80"
      - "${SERVER_HOST_PORT:-8080}:8080"
    volumes:
      - uploads:/var/lib/imaiplay/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
volumes:
  postgres_data:
  uploads:
