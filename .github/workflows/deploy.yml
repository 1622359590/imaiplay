name: Deploy to Baota

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Build immutable release image
        run: |
          set -eu
          release_image="imaiplay-server:${GITHUB_SHA}"
          docker build --tag "$release_image" .

      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          set -eu
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Deploy on Baota server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          release_image="imaiplay-server:${GITHUB_SHA}"
          deploy_path_quoted=$(printf '%q' "$DEPLOY_PATH")
          release_image_quoted=$(printf '%q' "$release_image")
          docker save "$release_image" | gzip -1 | ssh \
            -i "$HOME/.ssh/deploy_key" \
            -p "$SERVER_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$SERVER_USER@$SERVER_HOST" \
            "docker load"
          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -p "$SERVER_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$SERVER_USER@$SERVER_HOST" \
            "cd -- $deploy_path_quoted && if [ -f docker-compose.bt.yml ] && ! git ls-files --error-unmatch docker-compose.bt.yml >/dev/null 2>&1; then mv docker-compose.bt.yml docker-compose.bt.yml.pretracked-${GITHUB_RUN_ID}; fi && git pull --ff-only origin main && sh scripts/deploy-release.sh $release_image_quoted"

      - name: Verify backend health
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -eu
          deploy_path_quoted=$(printf '%q' "$DEPLOY_PATH")
          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -p "$SERVER_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$SERVER_USER@$SERVER_HOST" \
            "cd -- $deploy_path_quoted && sh scripts/verify-deployment.sh http://127.0.0.1:18080/health/db"
